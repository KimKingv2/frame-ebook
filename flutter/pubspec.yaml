name: frame_ebook
description: FRAME Ebook Flutter client for Web, macOS and Android.
publish_to: none
version: 0.4.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  material_ui: ^1.11.1
  web: ^1.1.1
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.6
  koni_archive_core: ^0.9.0
  koni_zip: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC-VF.ttf
          weight: 400
    - family: NotoSansSCFallback
      fonts:
        - asset: assets/fonts/NotoSansSC-VF.ttf
          weight: 400
  assets:
    - assets/fonts/OFL.txt
