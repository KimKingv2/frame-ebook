<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/flutter-preview/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FRAME Reader，專屬的雲端電子書與漫畫閱讀空間。">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FRAME Reader">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FRAME Reader</title>
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#12101a">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
<style id="frame-boot-style">
:root { color-scheme: dark; }
html, body {
  width: 100%;
  min-height: 100%;
  margin: 0;
  background: #12101a;
}
#frame-boot-message {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: max(24px, env(safe-area-inset-top)) 24px
    max(24px, env(safe-area-inset-bottom));
  box-sizing: border-box;
  background: radial-gradient(ellipse at 50% 42%, #241a38 0%, #12101a 68%);
  color: #d8c8ff;
  font: 14px/1.7 -apple-system, BlinkMacSystemFont, sans-serif;
  text-align: center;
}
#frame-boot-message[hidden],
#frame-boot-hint[hidden],
#frame-boot-retry[hidden] { display: none; }
#frame-boot-mark {
  color: #b99bff;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: .24em;
}
#frame-boot-title {
  margin: 8px 0 0;
  color: #f0eaff;
  font-size: 16px;
  font-weight: 600;
}
#frame-boot-detail, #frame-boot-hint {
  margin: 0;
  color: #a99bbf;
}
#frame-boot-retry {
  margin-top: 12px;
  padding: 9px 20px;
  border: 1px solid #7659a8;
  border-radius: 999px;
  background: #2a203b;
  color: #f0eaff;
  font: inherit;
  cursor: pointer;
}
</style>
</head>
<body>
<section id="frame-boot-message" role="status" aria-live="polite">
  <div id="frame-boot-mark" aria-hidden="true">FRAME</div>
  <p id="frame-boot-title">正在準備你的閱讀空間</p>
  <p id="frame-boot-detail">正在連線書架與同步閱讀狀態……</p>
  <p id="frame-boot-hint" hidden>啟動時間比預期長，請確認網路連線後重試。</p>
  <button id="frame-boot-retry" type="button" hidden>重新載入</button>
</section>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="frame-boot.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
