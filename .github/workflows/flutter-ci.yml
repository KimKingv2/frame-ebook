name: FRAME Ebook Flutter CI

on:
  push:
    branches:
      - feat/flutter-three-platform
  pull_request:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-ci.yml"

jobs:
  web:
    name: Analyze, test and build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        working-directory: flutter
        run: flutter create --platforms=web,macos,android --org com.kimkingv2 --project-name frame_ebook .
      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Format Dart sources
        working-directory: flutter
        run: dart format lib test
      - name: Analyze
        working-directory: flutter
        run: flutter analyze
      - name: Unit tests
        working-directory: flutter
        run: flutter test
      - name: Build Web
        working-directory: flutter
        run: flutter build web

  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        working-directory: flutter
        run: flutter create --platforms=web,macos,android --org com.kimkingv2 --project-name frame_ebook .
      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Build macOS
        working-directory: flutter
        run: flutter build macos

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        working-directory: flutter
        run: flutter create --platforms=web,macos,android --org com.kimkingv2 --project-name frame_ebook .
      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Build Android APK
        working-directory: flutter
        run: flutter build apk
