name: FRAME Ebook Flutter CI

on:
  push:
    branches:
      - feat/flutter-three-platform
      - main
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-ci.yml"

jobs:
  detect-native-changes:
    name: Detect native platform source changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.detect.outputs.android }}
      macos: ${{ steps.detect.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test native app rebuild policy
        run: python3 flutter/tool/test_native_build_policy.py
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE_SHA=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$BASE_REF"
            BASE_SHA="$(git merge-base FETCH_HEAD "$HEAD_SHA")"
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")"
          else
            BASE_SHA="$BEFORE_SHA"
            CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          fi

          TARGETS="$(printf '%s\n' "$CHANGED_FILES" | BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA" python3 flutter/tool/native_build_policy.py)"
          printf '%s\n' "$TARGETS" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$TARGETS"

  web:
    name: Analyze, test and build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        working-directory: flutter
        run: flutter create --platforms=web,macos,android --org com.kimkingv2 --project-name frame_ebook .
      - name: Configure release network permissions
        working-directory: flutter
        run: python3 tool/prepare_platforms.py
      - name: Verify synchronous Flutter first-frame listener
        working-directory: flutter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          expected = '<script src="frame-boot.js"></script>'
          if expected not in html:
              raise SystemExit("The Flutter first-frame listener must load synchronously before Flutter bootstrap.")
          if '<script src="frame-boot.js" defer></script>' in html:
              raise SystemExit("A deferred first-frame listener can miss Flutter's first-frame event.")
          print("Verified synchronous first-frame listener.")
          PY
      - name: Prepare bundled Traditional Chinese font
        working-directory: flutter
        run: python3 tool/prepare_fonts.py
      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Format Dart sources
        working-directory: flutter
        run: dart format lib test
      - name: Analyze
        working-directory: flutter
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        working-directory: flutter
        run: flutter test
      - name: Build Web
        working-directory: flutter
        run: flutter build web --base-href /flutter-preview/
      - name: Trim Flutter Web output for Pages Preview
        working-directory: flutter
        run: |
          python3 - <<'PY'
          import re
          import shutil
          from pathlib import Path

          web = Path("build/web")
          bootstrap = web / "flutter_bootstrap.js"
          html = bootstrap.read_text(encoding="utf-8")
          pattern = re.compile(
              r"_flutter\.loader\.load\(\{\s*serviceWorkerSettings:\s*\{.*?\}\s*\}\);",
              re.DOTALL,
          )
          replacement = "_flutter.loader.load({config: {canvasKitVariant: 'full', canvasKitBaseUrl: 'canvaskit/'}});"
          html, count = pattern.subn(replacement, html, count=1)
          if count != 1:
              raise SystemExit("Could not disable Flutter's generated service worker safely.")
          bootstrap.write_text(html, encoding="utf-8")
          if "canvasKitBaseUrl: 'canvaskit/'" not in html:
              raise SystemExit("Flutter Web must use the locally bundled CanvasKit runtime.")

          service_worker = web / "flutter_service_worker.js"
          if service_worker.exists():
              service_worker.unlink()
          source_map = web / "flutter.js.map"
          if source_map.exists():
              source_map.unlink()

          canvaskit = web / "canvaskit"
          if not (canvaskit / "canvaskit.js").is_file() or not (canvaskit / "canvaskit.wasm").is_file():
              raise SystemExit("Full CanvasKit runtime files are missing.")
          for item in canvaskit.iterdir():
              if item.name not in {"canvaskit.js", "canvaskit.wasm"}:
                  if item.is_dir():
                      shutil.rmtree(item)
                  else:
                      item.unlink()
          print("Kept the full CanvasKit runtime only; disabled persistent Flutter service-worker caching.")
          PY
      - name: Verify bundled font is present in Web output
        working-directory: flutter
        run: |
          test -s build/web/assets/assets/fonts/NotoSansTC-VF.ttf
          test -s build/web/assets/assets/fonts/NotoSansSC-VF.ttf
          grep -q '"family":"NotoSansTC"' build/web/assets/FontManifest.json
          grep -q '"family":"NotoSansSCFallback"' build/web/assets/FontManifest.json
      - name: Upload Web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-ebook-flutter-web
          path: flutter/build/web/
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Build macOS
    needs: detect-native-changes
    if: needs.detect-native-changes.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        working-directory: flutter
        run: flutter create --platforms=web,macos,android --org com.kimkingv2 --project-name frame_ebook .
      - name: Configure release network permissions
        working-directory: flutter
        run: python3 tool/prepare_platforms.py
      - name: Prepare bundled Traditional Chinese font
        working-directory: flutter
        run: python3 tool/prepare_fonts.py
      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Build macOS
        working-directory: flutter
        run: flutter build macos
      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-ebook-flutter-macos
          path: flutter/build/macos/Build/Products/Release/*.app
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android APK
    needs: detect-native-changes
    if: needs.detect-native-changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        working-directory: flutter
        run: flutter create --platforms=web,macos,android --org com.kimkingv2 --project-name frame_ebook .
      - name: Configure release network permissions
        working-directory: flutter
        run: python3 tool/prepare_platforms.py
      - name: Prepare bundled Traditional Chinese font
        working-directory: flutter
        run: python3 tool/prepare_fonts.py
      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Build Android APK
        working-directory: flutter
        run: flutter build apk
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-ebook-flutter-android-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  deploy-preview:
    name: Publish Flutter Web to Cloudflare Preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/flutter-three-platform'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Flutter Web artifact
        uses: actions/download-artifact@v4
        with:
          name: frame-ebook-flutter-web
          path: flutter-web-preview

      - name: Checkout Cloudflare Preview branch
        uses: actions/checkout@v4
        with:
          ref: cf-preview
          path: preview
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Flutter Web under /flutter-preview/
        run: |
          rm -rf preview/pages/flutter-preview
          mkdir -p preview/pages/flutter-preview
          cp -a flutter-web-preview/. preview/pages/flutter-preview/

          python3 - <<'PY'
          from pathlib import Path
          headers = Path("preview/pages/_headers")
          content = headers.read_text(encoding="utf-8")
          old = "script-src 'self';"
          new = "script-src 'self' 'wasm-unsafe-eval';"
          if old in content:
              content = content.replace(old, new, 1)
          elif new not in content:
              raise SystemExit("Could not locate the Preview CSP script-src directive.")
          headers.write_text(content, encoding="utf-8")
          PY

      - name: Commit Flutter Web Preview
        working-directory: preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/flutter-preview pages/_headers
          if git diff --cached --quiet; then
            echo "Flutter Web Preview is already up to date."
            exit 0
          fi
          git commit -m "Deploy Flutter Web Preview"
          git push origin HEAD:cf-preview

  deploy-production:
    name: Publish Flutter Web to Cloudflare Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Flutter Web artifact
        uses: actions/download-artifact@v4
        with:
          name: frame-ebook-flutter-web
          path: flutter-web-production

      - name: Checkout Production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Flutter Web under /flutter-preview/
        run: |
          rm -rf production/pages/flutter-preview
          mkdir -p production/pages/flutter-preview
          cp -a flutter-web-production/. production/pages/flutter-preview/

      - name: Commit Flutter Web Production
        working-directory: production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/flutter-preview
          if git diff --cached --quiet; then
            echo "Flutter Web Production is already up to date."
            exit 0
          fi
          git commit -m "Deploy Flutter Web Production"
          git push origin HEAD:main
